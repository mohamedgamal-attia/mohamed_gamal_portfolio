<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1524"/>
      <stop offset="1" stop-color="#0d1b2e"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <ellipse cx="120" cy="90" rx="360" ry="300" fill="url(#glow)" filter="url(#soft)" opacity="0.9"/>
  <ellipse cx="1120" cy="720" rx="380" ry="300" fill="url(#glow)" filter="url(#soft)" opacity="0.6"/>
  <g transform="translate(100,60)">
    <rect x="0" y="0" width="1000" height="46" rx="14" fill="#16294a"/>
    <rect x="0" y="23" width="1000" height="23" fill="#16294a"/>
    <circle cx="26" cy="23" r="6" fill="#ff5f57"/><circle cx="48" cy="23" r="6" fill="#febc2e"/><circle cx="70" cy="23" r="6" fill="#28c840"/>
    <rect x="360" y="12" width="280" height="22" rx="11" fill="#0a1524" opacity="0.6"/>
    <text x="500" y="28" font-family="Inter,sans-serif" font-size="12" fill="#9db4d8" text-anchor="middle">🔒 dotecengineering.com</text>
  </g>
  <!-- brand glow -->
  <ellipse cx="600.0" cy="300" rx="520" ry="240" fill="url(#glow)" filter="url(#soft)" opacity="0.7"/>
  <!-- white logo panel (logos ship on light backgrounds) -->
  <rect x="364" y="188" width="472" height="224" rx="26"
        fill="#ffffff" stroke="#2563eb" stroke-opacity="0.4" stroke-width="2"/>
  <image href="data:image/png;base64," x="410" y="234" width="380" height="132" preserveAspectRatio="xMidYMid meet"/>
  <text x="600.0" y="512" font-family="Space Grotesk,Inter,sans-serif" font-size="40" font-weight="700"
        fill="#eaf1ff" text-anchor="middle">DOTec Engineering</text>
  <text x="600.0" y="552" font-family="Inter,sans-serif" font-size="19" fill="#9db4d8" text-anchor="middle">Internal ERP · Project Lifecycle</text>
  <rect x="342" y="592" width="156" height="40" rx="20" fill="#16294a" stroke="#24406b" stroke-width="1"/><text x="420" y="617" font-family="Inter,sans-serif" font-size="14" font-weight="600" fill="#9db4d8" text-anchor="middle">Odoo 18</text><rect x="514" y="592" width="156" height="40" rx="20" fill="#16294a" stroke="#24406b" stroke-width="1"/><text x="592" y="617" font-family="Inter,sans-serif" font-size="14" font-weight="600" fill="#9db4d8" text-anchor="middle">Engineering</text><rect x="686" y="592" width="156" height="40" rx="20" fill="#16294a" stroke="#24406b" stroke-width="1"/><text x="764" y="617" font-family="Inter,sans-serif" font-size="14" font-weight="600" fill="#9db4d8" text-anchor="middle">USA</text>
</svg>