<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1319"/>
      <stop offset="1" stop-color="#241a22"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3b375"/>
      <stop offset="1" stop-color="#7c414c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e3b375" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e3b375" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <ellipse cx="120" cy="90" rx="360" ry="300" fill="url(#glow)" filter="url(#soft)" opacity="0.9"/>
  <ellipse cx="1120" cy="720" rx="380" ry="300" fill="url(#glow)" filter="url(#soft)" opacity="0.6"/>
  <g transform="translate(100,60)">
    <rect x="0" y="0" width="1000" height="46" rx="14" fill="#3a2a35"/>
    <rect x="0" y="23" width="1000" height="23" fill="#3a2a35"/>
    <circle cx="26" cy="23" r="6" fill="#ff5f57"/><circle cx="48" cy="23" r="6" fill="#febc2e"/><circle cx="70" cy="23" r="6" fill="#28c840"/>
    <rect x="360" y="12" width="280" height="22" rx="11" fill="#1b1319" opacity="0.6"/>
    <text x="500" y="28" font-family="Inter,sans-serif" font-size="12" fill="#ddd0d4" text-anchor="middle">🔒 ejadtech.sa</text>
  </g>
  <!-- brand glow -->
  <ellipse cx="600.0" cy="300" rx="520" ry="240" fill="url(#glow)" filter="url(#soft)" opacity="0.7"/>
  <!-- white logo panel (logos ship on light backgrounds) -->
  <rect x="274" y="188" width="652" height="224" rx="26"
        fill="#3a2a35" stroke="#e3b375" stroke-opacity="0.45" stroke-width="2"/>
  <image href="data:image/webp;base64," x="320" y="234" width="560" height="132" preserveAspectRatio="xMidYMid meet"/>
  <text x="600.0" y="512" font-family="Inter,Segoe UI,sans-serif" font-size="40" font-weight="700"
        fill="#f6f1e4" text-anchor="middle">EjadTech</text>
  <text x="600.0" y="552" font-family="Inter,sans-serif" font-size="19" fill="#ddd0d4" text-anchor="middle">Government Digital Transformation · Odoo Delivery</text>
  <rect x="342" y="592" width="156" height="40" rx="20" fill="#3a2a35" stroke="#4a3542" stroke-width="1"/><text x="420" y="617" font-family="Inter,sans-serif" font-size="14" font-weight="600" fill="#ddd0d4" text-anchor="middle">Odoo</text><rect x="514" y="592" width="156" height="40" rx="20" fill="#3a2a35" stroke="#4a3542" stroke-width="1"/><text x="592" y="617" font-family="Inter,sans-serif" font-size="14" font-weight="600" fill="#ddd0d4" text-anchor="middle">Gov Platforms</text><rect x="686" y="592" width="156" height="40" rx="20" fill="#3a2a35" stroke="#4a3542" stroke-width="1"/><text x="764" y="617" font-family="Inter,sans-serif" font-size="14" font-weight="600" fill="#ddd0d4" text-anchor="middle">KSA</text>
</svg>